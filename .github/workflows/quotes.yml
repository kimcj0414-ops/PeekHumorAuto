name: 스치듯 어른 명언 초안 만들기

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "generate(제미나이 초안) / check(계정 연결 점검, 게시 안 함)"
        default: generate
      count:
        description: "만들 세트 개수"
        default: "3"

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 준비
        run: pip install -q pillow playwright
      - name: 계정 점검
        if: ${{ github.event.inputs.mode == 'check' }}
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/check_accounts.py
      - name: 제미나이로 초안 + 카드 그리기
        if: ${{ github.event.inputs.mode != 'check' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_quotes.py ${{ github.event.inputs.count || '3' }}
      - name: 결과 저장
        run: |
          git config user.name "peek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sets
          if ! git diff --cached --quiet; then
            git commit -m "명언 초안 ($(TZ=Asia/Seoul date '+%m-%d %H:%M'))"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
