name: 스치듯 어른 명언 초안 만들기

on:
  workflow_dispatch:
    inputs:
      count:
        description: "만들 세트 개수"
        default: "3"

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 준비
        run: pip install -q pillow playwright
      - name: 제미나이로 초안 + 카드 그리기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_quotes.py ${{ github.event.inputs.count || '3' }}
      - name: 결과 저장
        run: |
          git config user.name "peek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sets
          if ! git diff --cached --quiet; then
            git commit -m "명언 초안 ($(TZ=Asia/Seoul date '+%m-%d %H:%M'))"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
