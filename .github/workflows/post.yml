name: 힐끔 유머 글 자동 업로드

on:
  schedule:
    - cron: "*/10 3 * * *"   # 한국시간 낮 12시대
    - cron: "15,45 4 * * *"  # 1시대 따라잡기
    - cron: "*/10 12 * * *"  # 한국시간 밤 9시대
    - cron: "15,45 13 * * *" # 10시대 따라잡기
    - cron: "7 0 * * *"      # 아침 9시 7분: 대기 글이 6개 미만이면 제미나이로 초안 12개 만들기
  workflow_dispatch:
    inputs:
      mode:
        description: "check(연결 확인) / now(지금 1개 올리기) / run / generate(제미나이 초안 만들기)"
        default: check

permissions:
  contents: write

concurrency:
  group: peek
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 할 일 실행
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          if [ "${{ github.event.schedule }}" = "7 0 * * *" ]; then MODE=generate_auto; fi
          case "$MODE" in
            generate) python scripts/generate.py 12 force ;;
            generate_auto) python scripts/generate.py 12 ;;
            *) python scripts/post.py "$MODE" ;;
          esac
      - name: 결과 저장
        run: |
          git config user.name "peek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json
          if ! git diff --cached --quiet; then
            git commit -m "업로드 기록 ($(TZ=Asia/Seoul date '+%m-%d %H:%M'))"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
